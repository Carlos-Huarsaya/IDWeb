<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Módulo de Registro para el Sistema de Gestión Académica </title>
    <link><link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <form action="/procesar" method="POST" class="form-container"> 
        <fieldset> 
            <legend>Información Personal</legend> 
            <div class="form-group"> 
                <label for="nombre" class="form-label">Nombres y Apellidos</label> 
                <input type="text" id="nombre" name="nombre" class="form-input" required placeholder="Carlos Manuel Huarsaya Vizcarra"> 
                
                <label for="telefono" class="form-label">Telefono</label>
                <input type="tel" id="telefono" name="telefono" class="form-input" required placeholder="+51 999 999 999">
                
                <label for="dia" class="form-label">Fecha de Nacimiento</label>
                <input type="date" id="dia" name="dia" class="form-input" required min="1990-01-01" max="2018-01-31">

                <label for="mañana" class="form-label">Turno Mañana</label>
                <input type="radio" id="manaña" name="turno" class="form-input" value="mañana" required><br>
                <label for="tarde" class="form-label">Turno Tarde</label>
                <input type="radio" id="tarde" name="turno" class="form-input" value="tarde" required>

            </div>
        </fieldset><br>
        <fieldset>
            <legend>Información de la Cuenta</legend>
            <div class="form-group">
                <label for="email" class="form-label">Correo Institucional:</label> 
                <input type="email" id="email" name="email" class="form-input" required placeholder="usuario@universidad.edu.pe"> 

                <label for="contraseña" class ="form-label">Contraseña</label>
                <input type="password" id="contraseña" name="contraseña" class="form-input" required placeholder="Abcdefg1" pattern="^(?=.*[A-Z])(?=.*\d)[A-Za-z\d\W_]{8,}$">   
            
                
                <label for="codigo" class="form-label">Codigo del estudiante</label>
                <input type="text" id="codigo" name="codigo" class="form-input" required pattern="[0-9]{8}" placeholder="012345678">
            </div>
        </fieldset>
        <label for="comentarios" class="form-label">Comentarios</label>
        <textarea class="form-textarea" id="comentarios"></textarea>
        <label for="terminos" class="form-label">Acepta terminos y condiciones</label>
        <input type="checkbox" class="form-input"><br>
        <button type="submit" class="form-input">Enviar</button>
    </form>
 

</body>
