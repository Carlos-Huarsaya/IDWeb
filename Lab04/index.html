<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestor de Tareas Universitarias</title>
  <script src="app.js" defer></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <h2>Gestor de Tareas Universitarias</h2>
  
  <div id="alertas"></div>

  <form id="form-tarea">
    <input type="text" id="titulo" placeholder="Título de la tarea">
    <input type="text" id="curso" placeholder="Curso">
    <input type="date" id="fechaEntrega">
    <button type="submit">Agregar</button>
  </form>

  <hr>

  <div>
    Filtro:
    <button onclick="cambiarFiltro('todas')">Todas</button>
    <button onclick="cambiarFiltro('pendientes')">Pendientes</button>
    <button onclick="cambiarFiltro('completadas')">Completadas</button>
  </div>

  <ul id="lista-tareas"></ul>
